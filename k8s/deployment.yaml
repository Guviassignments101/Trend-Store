apiVersion: apps/v1
kind: Deployment

metadata:
  name: trend-deployment
  labels:
    app: trend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: trend

  template:
    metadata:
      labels:
        app: trend

    spec:
      containers:
      - name: trend-container
        image: kubersid/trend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"
